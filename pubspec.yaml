name: cts_transport_app
description: "CTS Transport - A comprehensive ride-hailing and delivery platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  provider: ^6.0.0
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.13.0
  geolocator: ^10.0.0
  google_maps_flutter: ^2.5.0
  shared_preferences: ^2.2.0
  dio: ^5.3.0
  image_picker: ^1.0.0
  intl: ^0.19.0
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # ============================================
  # TESTING
  # ============================================
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  # ============================================
  # ASSETS
  # ============================================
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # ============================================
  # FONTS (Optional - For Custom Fonts)
  # ============================================
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700